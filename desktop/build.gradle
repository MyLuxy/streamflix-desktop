plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'application'
    id 'org.beryx.runtime' version '1.13.1'
}

kotlin {
    jvmToolchain(17)
}

application {
    mainClass = 'com.streamflixreborn.streamflix.desktop.BackendKt'
}

// self-contained JRE + native launcher for the backend, so end users never need
// a system Java install. jlink trims the JDK to just the modules actually touched;
// jpackage wraps that + the app jars into a runnable, OS-native app-image folder.
// module list is pinned explicitly (not left to jdeps auto-detection) so the three
// GitHub Actions OS runners all produce the same runtime instead of silently drifting.
runtime {
    options = ['--strip-debug', '--no-header-files', '--no-man-pages', '--compress', '2']
    modules = [
        'java.base',
        'java.net.http',
        'jdk.httpserver',   // com.sun.net.httpserver.HttpServer, used directly by Backend.kt
        'java.naming',      // OkHttp / DNS-over-HTTPS hostname handling
        'java.logging',     // OkHttp logging-interceptor
        'jdk.crypto.ec',    // ECDSA TLS cipher suites - missing this breaks HTTPS to some providers silently
        'jdk.zipfs',        // Jsoup / kotlinx-serialization jar resource access
        'jdk.unsupported',  // sun.misc.Unsafe - Gson's UnsafeAllocator needs it to build DTOs without no-arg constructors
    ]

    jpackage {
        imageName = 'streamflix-backend'
        skipInstaller = true
        appVersion = '1.0.3'
    }
}

// standalone proof-of-concept for a browser-based (hls.js + native <video controls>) player -
// see WebPlayerTest.kt. Separate entry point/task so it never gets bundled into the real app.
tasks.register('runWebPlayerTest', JavaExec) {
    group = 'application'
    mainClass = 'com.streamflixreborn.streamflix.desktop.WebPlayerTestKt'
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
}

// the real HTTP API + HLS proxy backing the web UI (VetoWeb) - see Backend.kt.
tasks.register('runBackend', JavaExec) {
    group = 'application'
    mainClass = 'com.streamflixreborn.streamflix.desktop.BackendKt'
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
}

dependencies {
    implementation project(':shared')

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.0'
}
