name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # the 3 build jobs below run in parallel and each just asks electron-builder to
  # publish to "the release for this tag, creating it if missing" - without this job
  # going first, two of them can both see "missing" at the same time and each create
  # their own release, splitting the assets across two drafts with the same tag
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the release exists before the build jobs race to create it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" || \
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --draft --title "StreamFlix ${{ github.ref_name }}" --notes ""

  build:
    needs: [create-release]
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install desktop-client dependencies
        working-directory: desktop-client
        run: npm ci

      - name: Build backend (jlink/jpackage)
        working-directory: desktop-client
        run: node scripts/copy-backend.mjs
        env:
          TMDB_PERSONAL_API_KEY: ${{ secrets.TMDB_PERSONAL_API_KEY }}

      - name: Build frontend (Next.js standalone)
        working-directory: desktop-client
        run: node scripts/copy-frontend.mjs

      # publishes straight to the GitHub Release for a tag push (electron-builder writes
      # the installer + the latest*.yml files electron-updater needs), otherwise just
      # builds locally so a manual run can be inspected as an artifact
      - name: Build installer
        working-directory: desktop-client
        run: npx electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streamflix-${{ matrix.os }}
          path: |
            desktop-client/build/*.exe
            desktop-client/build/*.dmg
            desktop-client/build/*.AppImage
            desktop-client/build/*.deb
          if-no-files-found: ignore
